# Public setup site only; no task execution API or private task files.
server {
    listen 80;
    listen [::]:80;
    server_name codex-lean-task.thinkelution.com codex-toptimizer.thinkelution.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/tasklean-acme; }
    location / { return 301 https://codex-lean-task.thinkelution.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codex-lean-task.thinkelution.com;
    ssl_certificate /etc/letsencrypt/live/codex-lean-task.thinkelution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codex-lean-task.thinkelution.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/tasklean-site/current;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codex-toptimizer.thinkelution.com;
    ssl_certificate /etc/letsencrypt/live/codex-lean-task.thinkelution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codex-lean-task.thinkelution.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://codex-lean-task.thinkelution.com$request_uri;
}
