[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tasklean"
version = "0.3.0b6"
description = "Codex LeanTask beta: persistent Codex tasks, focused code reads and compact tool output"
requires-python = ">=3.11"
dependencies = []
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]

[project.scripts]
tasklean = "tasklean.cli:main"

[tool.setuptools]
packages = ["tasklean"]

[tool.setuptools.package-data]
tasklean = ["web/*"]
