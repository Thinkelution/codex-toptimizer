[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tasklean"
version = "0.3.0b1"
description = "TaskLean beta: persistent Codex tasks, focused code reads and compact tool output"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tasklean = "tasklean.cli:main"

[tool.setuptools]
packages = ["tasklean"]
