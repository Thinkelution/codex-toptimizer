name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        working-directory: plugins/tasklean
      - run: python -m pip install ./plugins/tasklean
      - run: tasklean doctor
      - run: tasklean demo --out "$RUNNER_TEMP/tasklean-demo"
